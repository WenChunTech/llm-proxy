name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: llm-proxy-linux-x86_64
            binary: llm-proxy
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: llm-proxy-macos-x86_64
            binary: llm-proxy
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: llm-proxy-macos-aarch64
            binary: llm-proxy
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: llm-proxy-windows-x86_64
            binary: llm-proxy.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for private Cargo dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONVERTER_DEPLOY_KEY }}

      - name: Trust GitHub SSH host key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --locked --target ${{ matrix.target }} --package llm-proxy

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin_src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          package_dir="dist/${{ matrix.artifact }}"
          mkdir -p "${package_dir}"
          cp "${bin_src}" "${package_dir}/${{ matrix.binary }}"
          cp config.example.json "${package_dir}/config.example.json"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            archive_name="${{ matrix.artifact }}.zip"
            (
              cd dist
              if command -v zip >/dev/null 2>&1; then
                zip -r "${archive_name}" "${{ matrix.artifact }}"
              else
                7z a -tzip "${archive_name}" "${{ matrix.artifact }}"
              fi
            )
          else
            archive_name="${{ matrix.artifact }}.tar.gz"
            tar -C dist -czf "dist/${archive_name}" "${{ matrix.artifact }}"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${archive_name}" > "${archive_name}.sha256")
          else
            (cd dist && shasum -a 256 "${archive_name}" > "${archive_name}.sha256")
          fi

          echo "archive_path=dist/${archive_name}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=dist/${archive_name}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for private Cargo dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONVERTER_DEPLOY_KEY }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  release:
    name: Publish GitHub Release
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0 |
            while IFS= read -r -d '' file; do
              cp "${file}" release-assets/
            done
          asset_count="$(find release-assets -type f | wc -l | tr -d '[:space:]')"
          if [[ "${asset_count}" -eq 0 ]]; then
            echo "no release assets collected" >&2
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
